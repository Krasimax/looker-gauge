<!DOCTYPE html>
<html>
    <head>
        <script>
            function drawViz() {
                const data = dscc.getData();
                const container = document.getElementById("viz");
                const value = parseFloat(data.tables.DEFAULT[0].values[0]);

                let color = "#34a853"; // green
                if (value < 90) color = "#fbbc05"; // yellow
                if (value < 50) color = "#ea4335"; // red

                container.innerHTML = `
          <svg width="100" height="100" viewBox="0 0 36 36">
            <path fill="none" stroke="#eee" stroke-width="3" d="M18 2.0845
              a 15.9155 15.9155 0 0 1 0 31.831
              a 15.9155 15.9155 0 0 1 0 -31.831" />
            <path fill="none" stroke="${color}" stroke-width="3" stroke-dasharray="${value},100"
              d="M18 2.0845
              a 15.9155 15.9155 0 0 1 0 31.831
              a 15.9155 15.9155 0 0 1 0 -31.831" />
            <text x="18" y="20.35" font-size="6" text-anchor="middle" fill="${color}">${value}</text>
          </svg>
        `;
            }

            dscc.subscribeToData(drawViz, { transform: dscc.tableTransform });
        </script>
    </head>
    <body style="margin:0;">
        <div id="viz" style="display: flex; justify-content: center; align-items: center; height: 100%;"></div>
    </body>
</html>
