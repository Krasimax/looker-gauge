<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script>
      let currentScore = 0;

      function drawGauge(score) {
        const color =
          score >= 90 ? "#0cce6b" : score >= 50 ? "#ffa400" : "#ff4e42";

        const circle = document.getElementById("progress");
        const text = document.getElementById("score");
        const radius = circle.r.baseVal.value;
        const circumference = 2 * Math.PI * radius;

        const offset = circumference - (score / 100) * circumference;

        circle.style.strokeDasharray = `${circumference} ${circumference}`;
        circle.style.strokeDashoffset = offset;
        circle.style.stroke = color;

        text.textContent = Math.round(score);
      }

      function drawViz(data) {
        if (!data || !data.tables || !data.tables.DEFAULT) return;
        const value = data.tables.DEFAULT[0][0];
        if (typeof value === "number") {
          currentScore = value;
          drawGauge(currentScore);
        }
      }

      // Register with Looker Studio
      looker.plugins.visualizations.add({
        id: "gauge-viz",
        label: "Custom Gauge",
        create: function (element, config) {
          element.innerHTML = `
            <svg width="120" height="120" viewBox="0 0 120 120">
              <circle cx="60" cy="60" r="54" stroke="#eee" stroke-width="12" fill="none" />
              <circle id="progress" cx="60" cy="60" r="54" stroke="#ccc" stroke-width="12" fill="none"
                stroke-dasharray="339.292" stroke-dashoffset="339.292" transform="rotate(-90 60 60)" />
              <text id="score" x="60" y="68" font-size="22" text-anchor="middle" fill="#333">0</text>
            </svg>
          `;
        },
        updateAsync: function (data, element, config, queryResponse, details, done) {
          drawViz(data);
          done();
        },
      });
    </script>
  </head>
  <body></body>
</html>
